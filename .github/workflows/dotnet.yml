name: .NET CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PortfolioERP_BackEnd.sln

      - name: Build
        run: dotnet build backend/PortfolioERP_BackEnd.sln --no-restore

      - name: Run tests
        run: dotnet test backend/PortfolioERP_BackEnd.sln --no-build