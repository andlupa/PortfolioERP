<div class="container-fluid">
  <app-order-toolbar [totalItems]="totalItems"
                     (createRequested)="createOrder()"
                     (refreshRequested)="loadOrders()" />

  <div class="card shadow-sm mt-4">
    <div class="card-body border-bottom">
      <app-order-filter (filtersApplied)="applyFilters($event)"
                        (filtersReset)="resetFilters()" />
    </div>

    @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"
           role="status"></div>

      <p class="text-secondary mt-3 mb-0">
        Caricamento ordini...
      </p>
    </div>
    } @else if (error()) {
    <div class="card-body">
      <div class="alert alert-danger mb-0">
        {{ error() }}

        <button class="btn btn-sm btn-outline-danger ms-3"
                type="button"
                (click)="loadOrders()">
          Riprova
        </button>
      </div>
    </div>
    } @else {
    <app-order-table [orders]="orders()"
                     [sortBy]="sortBy"
                     [descending]="descending"
                     (sortingChanged)="changeSorting($event)"
                     (detailRequested)="openDetails($event)"
                     (confirmRequested)="requestConfirmation($event)"
                     (cancelRequested)="requestCancellation($event)" />

    <div class="card-footer bg-white">
      <app-order-pagination [pageNumber]="pageNumber"
                            [totalPages]="totalPages"
                            [totalItems]="totalItems"
                            (pageChanged)="changePage($event)" />
    </div>
    }
  </div>
</div>

<app-confirm-dialog [open]="dialogOpen"
                    [title]="dialogTitle"
                    [message]="dialogMessage"
                    [confirmText]="dialogConfirmText"
                    [danger]="dialogDanger"
                    [busy]="processingOrderId() !== null"
                    (confirmed)="executePendingAction()"
                    (cancelled)="closeDialog()" />

<app-toast [visible]="toastVisible()"
           [message]="toastMessage()"
           [type]="toastType()"
           (closed)="closeToast()" />
