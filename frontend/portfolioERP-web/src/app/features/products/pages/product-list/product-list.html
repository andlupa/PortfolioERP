<form
  class="row g-3 mb-4"
  (ngSubmit)="applyFilters()"
>
  <div class="col-lg-4">
    <label class="form-label" for="search">Ricerca</label>

    <input
      id="search"
      class="form-control"
      type="search"
      name="search"
      [(ngModel)]="search"
      placeholder="Codice, nome o descrizione"
    />
  </div>

  <div class="col-lg-3">
    <label class="form-label" for="categoryId">Categoria</label>

    <select
      id="categoryId"
      class="form-select"
      name="categoryId"
      [(ngModel)]="selectedCategoryId"
    >
      <option [ngValue]="null">Tutte le categorie</option>

      @for (category of categories(); track category.id) {
        <option [ngValue]="category.id">
          {{ category.name }}
        </option>
      }
    </select>
  </div>

  <div class="col-lg-2">
    <label class="form-label" for="status">Stato</label>

    <select
      id="status"
      class="form-select"
      name="status"
      [(ngModel)]="selectedStatus"
    >
      <option value="active">Attivi</option>
      <option value="inactive">Inattivi</option>
      <option value="all">Tutti</option>
    </select>
  </div>

  <div class="col-lg-3 d-flex align-items-end gap-2">
    <button class="btn btn-primary flex-fill" type="submit">
      Applica
    </button>

    <button
      class="btn btn-outline-secondary flex-fill"
      type="button"
      (click)="resetFilters()"
    >
      Azzera
    </button>
  </div>
</form>
