<div class="container-fluid">
  <app-product-toolbar [totalItems]="totalItems"
                       (createRequested)="createProduct()"
                       (refreshRequested)="loadProducts()" />

  <div class="card shadow-sm mt-4">
    <div class="card-body border-bottom">
      <app-product-filter [categories]="categories()"
                          (filtersApplied)="applyFilters($event)"
                          (filtersReset)="resetFilters()"
                          (searchChanged)="onSearchChanged($event)" />
    </div>

    @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-secondary mt-3 mb-0">
        Caricamento prodotti...
      </p>
    </div>
    } @else if (error()) {
    <div class="card-body">
      <div class="alert alert-danger mb-0">
        {{ error() }}

        <button class="btn btn-sm btn-outline-danger ms-3"
                type="button"
                (click)="loadProducts()">
          Riprova
        </button>
      </div>
    </div>
    } @else {
    <app-product-table [products]="products()"
                       [sortBy]="sortBy"
                       [descending]="descending"
                       [deactivatingProductId]="deactivatingProductId()"
                       (sortingChanged)="changeSorting($event)"
                       (editRequested)="editProduct($event)"
                       (deactivateRequested)="deactivateProduct($event)" />
    <div class="card-footer bg-white">
      <app-product-pagination [pageNumber]="pageNumber"
                              [totalPages]="totalPages"
                              [totalItems]="totalItems"
                              (pageChanged)="changePage($event)" />
    </div>
    }
  </div>
</div>

<app-confirm-dialog [open]="productToDeactivate() !== null"
                    title="Disattiva prodotto"
                    [message]="deactivationMessage()"
                    confirmText="Disattiva"
                    [danger]="true"
                    [busy]="deactivatingProductId() !== null"
                    (confirmed)="confirmDeactivation()"
                    (cancelled)="cancelDeactivation()" />

<app-toast [visible]="toastVisible()"
           [message]="toastMessage()"
           [type]="toastType()"
           (closed)="closeToast()" />
