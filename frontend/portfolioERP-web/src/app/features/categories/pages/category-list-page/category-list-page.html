<div class="container-fluid">
  <app-category-toolbar [totalItems]="categories().length"
                        (createRequested)="createCategory()"
                        (refreshRequested)="loadCategories()" />

  <div class="card shadow-sm mt-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-semibold">
        Elenco categorie
      </span>

      <div class="form-check form-switch">
        <input id="includeInactive"
               class="form-check-input"
               type="checkbox"
               [checked]="includeInactive()"
               (change)="toggleInactive()" />

        <label class="form-check-label"
               for="includeInactive">
          Mostra inattive
        </label>
      </div>
    </div>

    @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"
           role="status"></div>

      <p class="text-secondary mt-3 mb-0">
        Caricamento categorie...
      </p>
    </div>
    } @else if (error()) {
    <div class="card-body">
      <div class="alert alert-danger mb-0">
        {{ error() }}

        <button class="btn btn-sm btn-outline-danger ms-3"
                type="button"
                (click)="loadCategories()">
          Riprova
        </button>
      </div>
    </div>
    } @else {
    <app-category-table [categories]="categories()"
                        [deactivatingCategoryId]="
          deactivatingCategoryId()
        "
                        (editRequested)="editCategory($event)"
                        (deactivateRequested)="
          requestDeactivation($event)
        " />
    }
  </div>
</div>

<app-confirm-dialog [open]="categoryToDeactivate() !== null"
                    title="Disattiva categoria"
                    [message]="deactivationMessage"
                    confirmText="Disattiva"
                    [danger]="true"
                    [busy]="deactivatingCategoryId() !== null"
                    (confirmed)="confirmDeactivation()"
                    (cancelled)="cancelDeactivation()" />

<app-toast [visible]="toastVisible()"
           [message]="toastMessage()"
           [type]="toastType()"
           (closed)="closeToast()" />
